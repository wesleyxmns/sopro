<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 150" width="100%" height="100%">
  <style>
    .icon {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 48px;
      font-weight: 700;
      fill: #38bdf8;
    }
    .ascii {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 21px;
      font-weight: 700;
      white-space: pre;
      fill: #38bdf8;
      letter-spacing: 0px;
    }
    @media (prefers-color-scheme: light) {
      .icon, .ascii {
        fill: #0284c7;
      }
    }
    @media (prefers-color-scheme: dark) {
      .icon, .ascii {
        fill: #67e8f9;
      }
    }
  </style>
  <!-- Ícone de onda ≋ perfeitamente centralizado na altura da letra S -->
  <text x="46" y="75" text-anchor="middle" dominant-baseline="central" class="icon">≋</text>

  <!-- Logo ASCII SOPRO -->
  <text x="66" y="27" text-anchor="start" class="ascii">  ____   ___  ____  ____   ___  </text>
  <text x="66" y="51" text-anchor="start" class="ascii"> / ___| / _ \|  _ \|  _ \ / _ \ </text>
  <text x="66" y="75" text-anchor="start" class="ascii"> \___ \| | | | |_) | |_) | | | |</text>
  <text x="66" y="99" text-anchor="start" class="ascii">  ___) | |_| |  __/|  _ &lt;| |_| |</text>
  <text x="66" y="123" text-anchor="start" class="ascii"> |____/ \___/|_|   |_| \_\ \___/ </text>
</svg>
