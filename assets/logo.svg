<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <style>
    .ascii {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 22px;
      font-weight: 700;
      white-space: pre;
      fill: #38bdf8;
      letter-spacing: 0px;
    }
    @media (prefers-color-scheme: light) {
      .ascii {
        fill: #0284c7;
      }
    }
    @media (prefers-color-scheme: dark) {
      .ascii {
        fill: #67e8f9;
      }
    }
  </style>
  <text x="50%" y="35" text-anchor="middle" class="ascii">  ____   ___  ____  ____   ___  </text>
  <text x="50%" y="60" text-anchor="middle" class="ascii"> / ___| / _ \|  _ \|  _ \ / _ \ </text>
  <text x="50%" y="85" text-anchor="middle" class="ascii"> \___ \| | | | |_) | |_) | | | |</text>
  <text x="50%" y="110" text-anchor="middle" class="ascii">  ___) | |_| |  __/|  _ &lt;| |_| |</text>
  <text x="50%" y="135" text-anchor="middle" class="ascii"> |____/ \___/|_|   |_| \_\ \___/ </text>
</svg>
